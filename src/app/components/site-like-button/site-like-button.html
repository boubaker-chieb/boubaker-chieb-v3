<div class="site-like-widget">
  <div class="sparkle-burst" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <button
    type="button"
    class="site-like-button"
    [class.liked]="liked()"
    [disabled]="liked()"
    (click)="likeSite()"
    aria-label="Like this site"
  >
    <span class="site-like-icon" aria-hidden="true">
      <i class="fas fa-heart"></i>
    </span>
    <span class="site-like-label">Liked by {{ formatCount(count()) }} people</span>
  </button>

  @if (toastVisible()) {
    <div class="site-like-toast" role="status" aria-live="polite">
      <span class="toast-icon">✦</span>
      <span>Thanks for liking my site</span>
    </div>
  }
</div>
